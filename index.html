<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Ironcross</title>
<style type="text/css">
  * {
    margin: 0;
    padding: 0;
    -webkit-box-sizing: border-box;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    width: 100%;
    height: 100%;
    background: #0A0A09;
    overflow: hidden;
    -webkit-user-select: none;
  }
  #views {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 70px;
  }
  #clockView, #stopwatchView, #rutinaView, #gymView {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
  }
  #clockView {
    display: table;
    width: 100%;
    height: 100%;
  }
  #wrap {
    display: table-cell;
    vertical-align: middle;
    text-align: center;
  }
  #clock {
    display: inline-block;
    color: #EDE9DF;
    font-family: Helvetica, Arial, sans-serif;
    font-weight: bold;
    font-size: 150px;
    line-height: 1;
    letter-spacing: 2px;
    white-space: nowrap;
  }
  #clock .sec {
    color: #C23B22;
  }
  #brand {
    color: #C23B22;
    font-family: Helvetica, Arial, sans-serif;
    font-weight: bold;
    font-size: 34px;
    letter-spacing: 14px;
    margin-top: 30px;
    text-transform: uppercase;
  }

  /* tab bar */
  #tabBar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 70px;
    display: table;
    width: 100%;
    table-layout: fixed;
    -webkit-box-shadow: 0 -1px 0 #222;
  }
  .tab {
    display: table-cell;
    text-align: center;
    vertical-align: middle;
    color: #7A7568;
    font-family: Helvetica, Arial, sans-serif;
    font-weight: bold;
    font-size: 14px;
    letter-spacing: 1px;
    background: #141412;
    border-left: 1px solid #222;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    padding: 0 4px;
  }
  #tabClock { border-left: none; }
  .tab.active {
    color: #EDE9DF;
    background: #1E1D19;
    -webkit-box-shadow: inset 0 3px 0 #C23B22;
  }

  /* rutina view */
  #rutinaHeader {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 84px;
    padding: 10px 16px 0 16px;
  }
  #rutinaTitle {
    color: #7A7568;
    font-family: Helvetica, Arial, sans-serif;
    font-weight: bold;
    font-size: 13px;
    letter-spacing: 3px;
    margin-bottom: 8px;
  }
  #rutinaDays {
    white-space: nowrap;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .dayPill {
    display: inline-block;
    padding: 0 14px;
    height: 38px;
    line-height: 38px;
    margin-right: 8px;
    background: #141412;
    color: #7A7568;
    font-family: Helvetica, Arial, sans-serif;
    font-weight: bold;
    font-size: 14px;
    letter-spacing: 1px;
  }
  .dayPill.active {
    background: #C23B22;
    color: #EDE9DF;
  }
  #rutinaSubBar {
    position: absolute;
    top: 84px;
    left: 0;
    right: 0;
    height: 52px;
    padding: 8px 16px 0 16px;
    display: table;
    width: 100%;
    table-layout: fixed;
  }
  .rutinaSub {
    display: table-cell;
    text-align: center;
    vertical-align: middle;
    height: 36px;
    background: #141412;
    color: #7A7568;
    font-family: Helvetica, Arial, sans-serif;
    font-weight: bold;
    font-size: 13px;
    letter-spacing: 2px;
  }
  #rutinaSubDia { border-right: 1px solid #222; }
  .rutinaSub.active {
    color: #EDE9DF;
    background: #1E1D19;
    -webkit-box-shadow: inset 0 3px 0 #C23B22;
  }
  #rutinaBody, #rutinaCalcPane {
    position: absolute;
    top: 136px;
    left: 0;
    right: 0;
    bottom: 0;
  }
  #rutinaCalcPane {
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 0 16px 20px 16px;
  }
  #rutinaText {
    position: absolute;
    top: 8px;
    left: 16px;
    right: 16px;
    bottom: 74px;
    background: #141412;
    color: #EDE9DF;
    border: 1px solid #2A2A26;
    font-size: 18px;
    line-height: 1.3;
    font-family: Helvetica, Arial, sans-serif;
    padding: 10px;
  }
  #rutinaBtnRow {
    position: absolute;
    left: 16px;
    right: 16px;
    bottom: 10px;
    height: 44px;
  }
  .rutinaBtn {
    display: inline-block;
    width: 48%;
    height: 44px;
    line-height: 44px;
    text-align: center;
    color: #EDE9DF;
    font-family: Helvetica, Arial, sans-serif;
    font-weight: bold;
    font-size: 16px;
    letter-spacing: 2px;
  }
  #rutinaCopyBtn { background: #2A2A26; margin-right: 2%; }
  #rutinaSaveBtn { background: #C23B22; }
  #rutinaStatus {
    position: absolute;
    left: 16px;
    right: 16px;
    bottom: 56px;
    height: 16px;
    text-align: center;
    color: #7A7568;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 1px;
  }


  /* gym / oficina view */
  #gymView {
    display: none;
    overflow: hidden;
    background: #0A0A09;
  }
  #gymSubBar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 52px;
    padding: 8px 16px 0 16px;
    display: table;
    width: 100%;
    table-layout: fixed;
  }
  .gymSub {
    display: table-cell;
    text-align: center;
    vertical-align: middle;
    height: 36px;
    background: #141412;
    color: #7A7568;
    font-family: Helvetica, Arial, sans-serif;
    font-weight: bold;
    font-size: 13px;
    letter-spacing: 2px;
  }
  #gymSubOficina { border-right: 1px solid #222; }
  .gymSub.active {
    color: #EDE9DF;
    background: #1E1D19;
    -webkit-box-shadow: inset 0 3px 0 #C23B22;
  }
  #gymOficinaPane, #gymPlanesPane {
    position: absolute;
    top: 52px;
    left: 0;
    right: 0;
    bottom: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  #gymCounts {
    padding: 8px 16px 10px 16px;
  }
  .gymCount {
    display: inline-block;
    margin-right: 10px;
    margin-bottom: 8px;
    padding: 8px 12px;
    background: #141412;
    color: #EDE9DF;
    font-family: Helvetica, Arial, sans-serif;
  }
  .gymCount b {
    display: block;
    font-size: 22px;
    color: #EDE9DF;
  }
  .gymCount span {
    font-size: 11px;
    letter-spacing: 1px;
    color: #7A7568;
  }
  .gymCount.vencido b { color: #C23B22; }
  .gymCount.porvencer b { color: #C29A22; }
  #gymList {
    padding: 0 16px 20px 16px;
  }
  .gymRow {
    display: table;
    width: 100%;
    table-layout: fixed;
    padding: 10px 0;
    border-top: 1px solid #222;
  }
  .gymName {
    display: table-cell;
    color: #EDE9DF;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 16px;
    font-weight: bold;
    vertical-align: middle;
  }
  .gymMeta {
    display: table-cell;
    width: 110px;
    text-align: right;
    color: #7A7568;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 14px;
    vertical-align: middle;
  }
  .gymRow.V .gymMeta { color: #C23B22; }
  .gymRow.P .gymMeta { color: #C29A22; }
  #gymStatus {
    padding: 20px 16px;
    color: #7A7568;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 14px;
  }

  #gymPlanes {
    padding: 4px 16px 20px 16px;
  }
  .gymPlanGrupo {
    color: #7A7568;
    font-family: Helvetica, Arial, sans-serif;
    font-weight: bold;
    font-size: 11px;
    letter-spacing: 2px;
    margin-top: 16px;
    margin-bottom: 2px;
  }
  .gymPlanRow {
    padding: 10px 0 12px 0;
    border-top: 1px solid #222;
  }
  .gymPlanHead {
    display: table;
    width: 100%;
    table-layout: fixed;
    margin-bottom: 6px;
  }
  .gymPlanName {
    display: table-cell;
    color: #EDE9DF;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 16px;
    font-weight: bold;
    vertical-align: middle;
  }
  .gymPlanPrice {
    display: table-cell;
    width: 110px;
    text-align: right;
    color: #7A7568;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 14px;
    vertical-align: middle;
  }
  .gymPlanUrl {
    display: block;
    width: 100%;
    background: #141412;
    color: #EDE9DF;
    border: 1px solid #2A2A26;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 12px;
    padding: 8px;
    -webkit-user-select: text;
    user-select: text;
  }
  .gymPlanCopyBtn {
    display: inline-block;
    margin-top: 6px;
    padding: 0 14px;
    height: 32px;
    line-height: 32px;
    background: #2A2A26;
    color: #EDE9DF;
    font-family: Helvetica, Arial, sans-serif;
    font-weight: bold;
    font-size: 12px;
    letter-spacing: 1px;
  }

  /* stopwatch view */
  #swHeader {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    padding: 14px 20px;
  }
  #swTitle {
    color: #7A7568;
    font-family: Helvetica, Arial, sans-serif;
    font-weight: bold;
    font-size: 18px;
    letter-spacing: 4px;
  }
  #addRow {
    margin-top: 12px;
  }
  .addBtn {
    display: inline-block;
    width: 48%;
    height: 60px;
    line-height: 60px;
    text-align: center;
    color: #EDE9DF;
    font-family: Helvetica, Arial, sans-serif;
    font-weight: bold;
    font-size: 18px;
    letter-spacing: 1px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    padding: 0 6px;
  }
  #addSwBtn { background: #C23B22; margin-right: 2%; }
  #addTimerBtn { background: #C29A22; }
  #swEmpty {
    position: absolute;
    top: 148px; /* fallback; ajustado por JS segun alto real de #swHeader */
    left: 0;
    right: 0;
    bottom: 0;
    text-align: center;
    color: #4A473F;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 22px;
    line-height: 1.4;
    padding-top: 40px;
  }
  #swList {
    position: absolute;
    top: 148px; /* fallback; ajustado por JS segun alto real de #swHeader */
    left: 0;
    right: 0;
    bottom: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  #swGrid {
    position: relative;
  }
  .swRow {
    position: absolute;
    background: #141412;
    border-top: 6px solid #C23B22;
    padding: 12px 10px;
    text-align: center;
    overflow: hidden;
  }
  .swRow.swTimer {
    border-top-color: #C29A22;
  }
  .swLabel {
    display: inline-block;
    color: #7A7568;
    font-family: Helvetica, Arial, sans-serif;
    font-weight: bold;
    font-size: 14px;
    letter-spacing: 1px;
    border-bottom: 1px dashed #4A473F;
    padding-bottom: 2px;
  }
  .swTime {
    display: inline-block;
    color: #EDE9DF;
    font-family: Helvetica, Arial, sans-serif;
    font-weight: bold;
    font-size: 56px;
    line-height: 1;
    margin-top: 8px;
    white-space: nowrap;
  }
  .swBtns {
    margin-top: 8px;
  }
  .swBtn {
    display: inline-block;
    height: 40px;
    padding: 0 10px;
    margin: 2px;
    color: #EDE9DF;
    font-family: Helvetica, Arial, sans-serif;
    font-weight: bold;
    font-size: 14px;
    line-height: 40px;
    text-align: center;
  }
  .swStart { background: #2E6B3E; }
  .swPause { background: #C29A22; }
  .swReset { background: #2A2A26; }
  .swRemove { background: #5A1E14; width: 40px; padding: 0; }

  /* selector de tiempo del temporizador (un toque, sin escribir) */
  #presetOverlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85);
    z-index: 20;
  }
  #presetCard {
    position: absolute;
    top: 40px; left: 16px; right: 16px; bottom: 40px;
    background: #141412;
    border: 1px solid #2A2A26;
    padding: 20px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  #presetTitle {
    color: #7A7568;
    font-family: Helvetica, Arial, sans-serif;
    font-weight: bold;
    font-size: 18px;
    letter-spacing: 3px;
    margin-bottom: 16px;
  }
  .presetBtn {
    display: inline-block;
    width: 31%;
    margin: 0 2% 12px 0;
    height: 64px;
    line-height: 64px;
    text-align: center;
    background: #0A0A09;
    border: 1px solid #2A2A26;
    color: #EDE9DF;
    font-family: Helvetica, Arial, sans-serif;
    font-weight: bold;
    font-size: 20px;
  }
  .presetBtnOther { background: #2A2A26; }
  #presetCancelBtn {
    display: block;
    margin-top: 8px;
    height: 48px;
    line-height: 48px;
    text-align: center;
    background: #5A1E14;
    color: #EDE9DF;
    font-family: Helvetica, Arial, sans-serif;
    font-weight: bold;
    font-size: 16px;
    letter-spacing: 2px;
  }

  /* calculadora basica (pestaña dentro de Rutina) */
  .calcCard {
    background: #141412;
    border: 1px solid #2A2A26;
    padding: 14px;
    margin-top: 14px;
  }
  .calcCardTitle {
    color: #EDE9DF;
    font-family: Helvetica, Arial, sans-serif;
    font-weight: bold;
    font-size: 15px;
    letter-spacing: 2px;
    margin-bottom: 12px;
  }
  .calcRow {
    display: table;
    width: 100%;
    table-layout: fixed;
  }
  .calcField {
    display: table-cell;
    padding-right: 10px;
  }
  .calcField.calcFieldLast {
    padding-right: 0;
    padding-left: 10px;
  }
  .calcLabel {
    color: #7A7568;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .calcInput {
    width: 100%;
    height: 54px;
    background: #0A0A09;
    color: #EDE9DF;
    border: 1px solid #2A2A26;
    font-size: 26px;
    font-family: Helvetica, Arial, sans-serif;
    padding: 0 12px;
    -webkit-appearance: none;
  }
  .calcResult {
    margin-top: 14px;
  }
  .calcChip {
    display: inline-block;
    background: #0A0A09;
    border: 1px solid #2A2A26;
    color: #EDE9DF;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 16px;
    font-weight: bold;
    padding: 8px 12px;
    margin: 0 6px 6px 0;
  }
  .calcTotalLabel {
    color: #7A7568;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 2px;
    margin-bottom: 6px;
  }
  .calcTotal {
    color: #C23B22;
    font-family: Helvetica, Arial, sans-serif;
    font-weight: bold;
    font-size: 42px;
  }
</style>
</head>
<body>

<div id="views">
  <div id="clockView">
    <div id="wrap">
      <div id="clock">--:--:--</div>
      <div id="brand">IRONCROSS</div>
    </div>
  </div>

  <div id="stopwatchView" style="display:none;">
    <div id="swHeader">
      <div id="swTitle">CRONOMETROS Y TEMPORIZADORES</div>
      <div id="addRow">
        <div id="addSwBtn" class="addBtn">+ CRONOMETRO</div>
        <div id="addTimerBtn" class="addBtn">+ TEMPORIZADOR</div>
      </div>
    </div>
    <div id="swEmpty">Toca "+ CRONOMETRO" para tomar un tiempo,<br>o "+ TEMPORIZADOR" para una cuenta regresiva</div>
    <div id="swList"><div id="swGrid"></div></div>

    <div id="presetOverlay" style="display:none;">
      <div id="presetCard">
        <div id="presetTitle">ELEGIR TIEMPO</div>
        <div id="presetGrid"></div>
        <div id="presetCancelBtn">CANCELAR</div>
      </div>
    </div>
  </div>


  <div id="gymView" style="display:none;">
    <div id="gymSubBar">
      <div id="gymSubOficina" class="gymSub active">OFICINA</div>
      <div id="gymSubPlanes" class="gymSub">PLANES</div>
    </div>
    <div id="gymOficinaPane">
      <div id="gymCounts"></div>
      <div id="gymList"></div>
      <div id="gymStatus">&nbsp;</div>
    </div>
    <div id="gymPlanesPane" style="display:none;">
      <div id="gymPlanes"></div>
    </div>
  </div>
  <div id="rutinaView" style="display:none;">
    <div id="rutinaHeader">
      <div id="rutinaTitle">RUTINAS</div>
      <div id="rutinaDays"></div>
    </div>
    <div id="rutinaSubBar">
      <div id="rutinaSubDia" class="rutinaSub active">RUTINA</div>
      <div id="rutinaSubCalc" class="rutinaSub">CALC</div>
    </div>
    <div id="rutinaBody">
      <textarea id="rutinaText"></textarea>
      <div id="rutinaBtnRow">
        <div id="rutinaCopyBtn" class="rutinaBtn">COPIAR</div>
        <div id="rutinaSaveBtn" class="rutinaBtn">GUARDAR</div>
      </div>
      <div id="rutinaStatus">&nbsp;</div>
    </div>
    <div id="rutinaCalcPane" style="display:none;">
      <div class="calcCard">
        <div class="calcCardTitle">CALCULADORA</div>
        <div class="calcRow">
          <div class="calcField">
            <div class="calcLabel">NUMERO A</div>
            <input type="number" id="calcA" class="calcInput" value="">
          </div>
          <div class="calcField calcFieldLast">
            <div class="calcLabel">NUMERO B</div>
            <input type="number" id="calcB" class="calcInput" value="">
          </div>
        </div>
        <div id="calcBasicResult" class="calcResult"></div>
      </div>
    </div>
  </div>
</div>

<script type="text/javascript">
(function () {

  function pad(n) {
    return (n < 10 ? '0' : '') + n;
  }

  /* ---------- copiar al portapapeles ----------
     Selecciona el texto y usa document.execCommand('copy') (funciona en
     Safari moderno / iPhone). En el iPad 1 (Safari muy viejo) execCommand
     no existe: el texto queda seleccionado igual y se puede copiar con el
     menu nativo de seleccion, que si funciona ahi. */
  function copiarDesdeCampo(campo) {
    var ok = false;
    try {
      campo.focus();
      if (campo.select) { campo.select(); }
      if (campo.setSelectionRange) { campo.setSelectionRange(0, String(campo.value).length); }
      ok = !!(document.execCommand && document.execCommand('copy'));
    } catch (e) {}
    return ok;
  }

  /* ---------- reloj ---------- */
  var clock = document.getElementById('clock');

  function tick() {
    var d = new Date();
    var h = pad(d.getHours());
    var m = pad(d.getMinutes());
    var s = pad(d.getSeconds());
    clock.innerHTML = h + ':' + m + ':<span class="sec">' + s + '</span>';
  }

  function fitClock() {
    clock.style.fontSize = '100px';
    var w = clock.offsetWidth;
    if (!w) { return; }
    var target = window.innerWidth * 0.92;
    var newSize = Math.floor(100 * target / w);
    if (newSize < 40) { newSize = 40; }
    clock.style.fontSize = newSize + 'px';
  }

  tick();
  fitClock();
  setInterval(tick, 1000);
  window.addEventListener('resize', function () {
    fitClock();
    positionSwBody();
    reflowGrid();
  }, false);
  window.addEventListener('orientationchange', function () {
    setTimeout(function () {
      fitClock();
      positionSwBody();
      reflowGrid();
    }, 300);
  }, false);

  /* ---------- tabs ---------- */
  var clockView = document.getElementById('clockView');
  var stopwatchView = document.getElementById('stopwatchView');
  var rutinaView = document.getElementById('rutinaView');
  var tabClock = document.getElementById('tabClock');
  var tabStopwatch = document.getElementById('tabStopwatch');
  var tabRutina = document.getElementById('tabRutina');
  var gymView = document.getElementById('gymView');
  var tabGym = document.getElementById('tabGym');

  function hideAllViews() {
    clockView.style.display = 'none';
    stopwatchView.style.display = 'none';
    rutinaView.style.display = 'none';
    gymView.style.display = 'none';
    tabClock.className = 'tab';
    tabStopwatch.className = 'tab';
    tabRutina.className = 'tab';
    tabGym.className = 'tab';
  }

  function showClock() {
    hideAllViews();
    clockView.style.display = 'table';
    tabClock.className = 'tab active';
    fitClock();
  }

  function showStopwatch() {
    hideAllViews();
    stopwatchView.style.display = 'block';
    tabStopwatch.className = 'tab active';
    positionSwBody();
    reflowGrid();
  }

  function showRutina() {
    hideAllViews();
    rutinaView.style.display = 'block';
    tabRutina.className = 'tab active';
    showRutinaSubDia();
    cargarDias();
  }

  function showGym() {
    hideAllViews();
    gymView.style.display = 'block';
    tabGym.className = 'tab active';
    showGymOficina();
  }

  tabClock.addEventListener('click', showClock, false);
  tabStopwatch.addEventListener('click', showStopwatch, false);
  tabRutina.addEventListener('click', showRutina, false);
  tabGym.addEventListener('click', showGym, false);


  /* ---------- oficina / gym ---------- */

  var gymList = document.getElementById('gymList');

    var s = String(n);
    var out = '';
    while (s.length > 3) {
      out = '.' + s.slice(-3) + out;
      s = s.slice(0, -3);

  var gymOficinaPane = document.getElementById('gymOficinaPane');

  function renderPlanes() {

      var head = document.createElement('div');

      var copyBtn = document.createElement('div');

      (function (campo, boton) {

          var ok = copiarDesdeCampo(campo);
          boton.innerHTML = ok ? 'COPIADO' : 'SELECCIONADO';
          setTimeout(function () { boton.innerHTML = 'COPIAR LINK'; }, 1200);
        }, false);
      })(inp, copyBtn);

      row.appendChild(head);
      row.appendChild(inp);
      row.appendChild(copyBtn);
      wrap.appendChild(row);

  }

  renderPlanes();

  function cargarOficina() {
    gymStatus.innerHTML = 'Cargando...';
    gymCounts.innerHTML = '';
    gymList.innerHTML = '';
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/api/oficina', true);
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) { return; }
      if (xhr.status !== 200) {
        gymStatus.innerHTML = 'No se pudo cargar';
        return;
      }
      gymStatus.innerHTML = '&nbsp;';
      var lines = xhr.responseText.split('\n');
      var counts = { activos: '0', vencidos: '0', por_vencer: '0', sin_plan: '0' };
      var i;
      for (i = 0; i < lines.length; i++) {
        var parts = lines[i].split('|');
        if (parts[0] === 'C' && parts.length >= 3) {
          counts[parts[1]] = parts[2];
        } else if (parts[0] === 'R' && parts.length >= 3) {
          var row = document.createElement('div');
          row.className = 'gymRow ' + parts[1];
          var name = document.createElement('div');
          name.className = 'gymName';
          name.innerHTML = parts[2];
          var meta = document.createElement('div');
          meta.className = 'gymMeta';
          var bits = [];
          if (parts[3]) { bits.push(fmtMonto(parts[3])); }
          if (parts[4]) { bits.push(parts[4]); }
          meta.innerHTML = bits.join(' · ');
          row.appendChild(name);
          row.appendChild(meta);
          gymList.appendChild(row);
        }
      }
      function countBox(cls, label, val) {
        var d = document.createElement('div');
        d.className = 'gymCount ' + cls;
        d.innerHTML = '<b>' + val + '</b><span>' + label + '</span>';
        gymCounts.appendChild(d);
      }
      countBox('vencido', 'VENCIDOS', counts.vencidos);
      countBox('porvencer', 'POR VENCER', counts.por_vencer);
      countBox('', 'ACTIVOS', counts.activos);
      countBox('', 'SIN PLAN', counts.sin_plan);
    };
    xhr.send(null);
  }

  /* ---------- rutina ---------- */
  var rutinaText = document.getElementById('rutinaText');
  var rutinaSaveBtn = document.getElementById('rutinaSaveBtn');
  var rutinaCopyBtn = document.getElementById('rutinaCopyBtn');
  var rutinaStatus = document.getElementById('rutinaStatus');
  var rutinaDays = document.getElementById('rutinaDays');
  var rutinaBody = document.getElementById('rutinaBody');
  var rutinaCalcPane = document.getElementById('rutinaCalcPane');
  var rutinaSubDia = document.getElementById('rutinaSubDia');
  var rutinaSubCalc = document.getElementById('rutinaSubCalc');

  function showRutinaSubDia() {
    rutinaBody.style.display = 'block';
    rutinaCalcPane.style.display = 'none';
    rutinaSubDia.className = 'rutinaSub active';
    rutinaSubCalc.className = 'rutinaSub';

  function showRutinaSubCalc() {

    rutinaCalcPane.style.display = 'block';
    rutinaSubDia.className = 'rutinaSub';
    rutinaSubCalc.className = 'rutinaSub active';

  rutinaSubDia.addEventListener('click', showRutinaSubDia, false);
  rutinaSubCalc.addEventListener('click', showRutinaSubCalc, false);

  var fechaSeleccionada = null;
  var diasCache = [];
  var hoyGlobal = null;
  var manianaGlobal = null;

  function pillLabel(fecha) {
    if (fecha === hoyGlobal) { return 'HOY'; }
    if (fecha === manianaGlobal) { return 'MAÑANA'; }
    var partes = fecha.split('-');
    return partes[2] + '/' + partes[1];
  }

  function pintarPills() {
    rutinaDays.innerHTML = '';
    for (var i = 0; i < diasCache.length; i++) {
      (function (fecha) {
        var pill = document.createElement('div');
        pill.className = 'dayPill' + (fecha === fechaSeleccionada ? ' active' : '');
        pill.innerHTML = pillLabel(fecha);
        pill.addEventListener('click', function () { seleccionarDia(fecha); }, false);
        rutinaDays.appendChild(pill);
      })(diasCache[i]);
    }
  }

  function fitRutinaText() {
    var size = 18;
    rutinaText.style.fontSize = size + 'px';
    while (rutinaText.scrollHeight > rutinaText.clientHeight && size > 15) {
      size -= 1;
      rutinaText.style.fontSize = size + 'px';
    }
  }

  var PLANTILLA_RUTINA = 'PREPARACION\n\nCALENTAMIENTO\n\nPIERNAS\n\nELONGACION\n\nCORE\n\nPOSTURAS\n\nSUPER SET\n\nELONGACION\n';

  function cargarRutinaFecha(fecha) {
    rutinaStatus.innerHTML = 'Cargando...';
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/api/rutina?fecha=' + encodeURIComponent(fecha), true);
    xhr.onreadystatechange = function () {
      if (xhr.readyState === 4) {
        if (xhr.status === 200) {
          var t = xhr.responseText;
          if (!t || !String(t).replace(/^\s+|\s+$/g, '')) { t = PLANTILLA_RUTINA; }
          rutinaText.value = t;
          rutinaStatus.innerHTML = '&nbsp;';
          fitRutinaText();
        } else {
          rutinaStatus.innerHTML = 'No se pudo cargar la rutina';
        }
      }
    };
    xhr.send(null);

  function seleccionarDia(fecha) {
    fechaSeleccionada = fecha;
    pintarPills();
    cargarRutinaFecha(fecha);
  }

  function cargarDias() {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/api/rutina/dias', true);
    xhr.onreadystatechange = function () {
      if (xhr.readyState === 4 && xhr.status === 200) {
        var lineas = xhr.responseText.split('\n');
        hoyGlobal = lineas[0].split(':')[1];
        manianaGlobal = lineas[1].split(':')[1];
        diasCache = lineas[2].substring('DIAS:'.length).split(',');
        if (fechaSeleccionada === null || diasCache.indexOf(fechaSeleccionada) === -1) {
          fechaSeleccionada = hoyGlobal;
          pintarPills();
          cargarRutinaFecha(fechaSeleccionada);
        } else {
          pintarPills();
        }
      }
    };
    xhr.send(null);
  }

  function guardarRutina() {

    xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
    xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
    xhr.onreadystatechange = function () {
      if (xhr.readyState === 4) {
        if (xhr.status === 200) {
          rutinaStatus.innerHTML = 'Guardado';
          cargarDias();
        } else {
          rutinaStatus.innerHTML = 'No se pudo guardar';

    xhr.send('fecha=' + encodeURIComponent(fechaSeleccionada) + '&rutina=' + encodeURIComponent(rutinaText.value));
  }

  rutinaSaveBtn.addEventListener('click', guardarRutina, false);

  /* ---------- cronometros y temporizadores ---------- */
  var swHeader = document.getElementById('swHeader');
  var swList = document.getElementById('swList');
  var swGrid = document.getElementById('swGrid');
  var swEmpty = document.getElementById('swEmpty');
  var addSwBtn = document.getElementById('addSwBtn');
  var addTimerBtn = document.getElementById('addTimerBtn');
  var stopwatches = [];
  var nextId = 1;
  var COLOR_BG = '#141412';
  var COLOR_DONE = '#C23B22';
  var GRID_GAP = 10;
  var GRID_PAD = 10;

  function positionSwBody() {
    var h = swHeader.offsetHeight;
    if (!h) { return; }
    swEmpty.style.top = h + 'px';
    swList.style.top = h + 'px';
  }

  /* ---------- sonido ---------- */
  var beepSound = document.getElementById('beepSound');
  var audioUnlocked = false;

  function unlockAudio() {
    if (audioUnlocked) { return; }
    audioUnlocked = true;
    try {
      beepSound.play();
      beepSound.pause();
      beepSound.currentTime = 0;
    } catch (e) {}
  }

  document.body.addEventListener('touchstart', unlockAudio, false);
  document.body.addEventListener('click', unlockAudio, false);

  function playBeep() {
    try {
      beepSound.currentTime = 0;
      beepSound.play();
    } catch (e) {}
  }

  function fitSwTimeSize(tileW, tileH) {
    if (stopwatches.length === 0) { return; }
    var probe = stopwatches[0].timeEl;
    probe.style.fontSize = '56px';
    var w = probe.offsetWidth;
    if (!w) { return; }
    var available = (tileW - 20) * 0.92;
    var size = Math.floor(56 * available / w);
    var cap = Math.max(26, Math.min(220, Math.floor(tileH * 0.5)));
    if (size < 26) { size = 26; }
    if (size > cap) { size = cap; }
    for (var j = 0; j < stopwatches.length; j++) {
      stopwatches[j].timeEl.style.fontSize = size + 'px';
    }
  }

  /* Prueba cols de 1 hasta count y se queda con la combinacion cols/rows
     que deja el lado mas chico de cada cronometro lo mas grande posible,
     para que entren todos a la vez sin perder legibilidad. Con 1 cronometro
     da pantalla completa; con 2, 3, 4, 6, etc. se reparte solo. */
  function computeGrid(count, containerW, containerH) {
    if (count < 1) { count = 1; }
    var bestCols = 1;
    var bestScore = -1;
    for (var cols = 1; cols <= count; cols++) {
      var rows = Math.ceil(count / cols);
      var tileW = (containerW - GRID_PAD * 2 - GRID_GAP * (cols - 1)) / cols;
      var tileH = (containerH - GRID_PAD * 2 - GRID_GAP * (rows - 1)) / rows;
      if (tileW <= 0 || tileH <= 0) { continue; }
      var score = Math.min(tileW, tileH);
      if (score > bestScore) {
        bestScore = score;
        bestCols = cols;
      }
    }
    return { cols: bestCols, rows: Math.ceil(count / bestCols) };
  }

  function reflowGrid() {
    var containerW = swList.clientWidth;
    var containerH = swList.clientHeight;
    if (!containerW || !containerH) { return; }

    var grid = computeGrid(stopwatches.length, containerW, containerH);
    var cols = grid.cols;
    var rows = grid.rows;

    var tileW = Math.floor((containerW - GRID_PAD * 2 - GRID_GAP * (cols - 1)) / cols);
    var tileH = Math.floor((containerH - GRID_PAD * 2 - GRID_GAP * (rows - 1)) / rows);

    fitSwTimeSize(tileW, tileH);

    for (var i = 0; i < stopwatches.length; i++) {
      var col = i % cols;
      var row = Math.floor(i / cols);
      var el = stopwatches[i].rowEl;
      el.style.width = tileW + 'px';
      el.style.height = tileH + 'px';
      el.style.left = (GRID_PAD + col * (tileW + GRID_GAP)) + 'px';
      el.style.top = (GRID_PAD + row * (tileH + GRID_GAP)) + 'px';
    }

    var gridHeight = GRID_PAD * 2 + rows * tileH + (rows - 1) * GRID_GAP;
    swGrid.style.height = gridHeight + 'px';
  }

  function fmt(ms) {
    if (ms < 0) { ms = 0; }
    var totalTenths = Math.floor(ms / 100);
    var tenths = totalTenths % 10;
    var totalSec = Math.floor(totalTenths / 10);
    var sec = totalSec % 60;
    var min = Math.floor(totalSec / 60);
    return pad(min) + ':' + pad(sec) + '.' + tenths;
  }

  function updateEmptyState() {
    swEmpty.style.display = stopwatches.length ? 'none' : 'block';
  }

  function getElapsed(sw) {
    var e = sw.elapsedMs;
    if (sw.running) {
      e += (Date.now() - sw.startTs);
    }
    return e;
  }

  function redrawRow(sw) {
    var elapsed = getElapsed(sw);

    if (sw.type === 'timer') {
      var remaining = sw.totalMs - elapsed;
      if (remaining <= 0) {
        remaining = 0;
        if (sw.running) {
          sw.running = false;
          sw.elapsedMs = sw.totalMs;
          sw.done = true;
        }
      }
      if (sw.done && !sw.beeped) {
        sw.beeped = true;
        playBeep();
        setTimeout(playBeep, 400);
        setTimeout(playBeep, 800);
      }
      sw.timeEl.innerHTML = fmt(remaining);
    } else {
      sw.timeEl.innerHTML = fmt(elapsed);
    }

    if (sw.running) {
      sw.startBtn.innerHTML = 'PAUSAR';
      sw.startBtn.className = 'swBtn swPause';
    } else {
      sw.startBtn.innerHTML = 'INICIAR';
      sw.startBtn.className = 'swBtn swStart';
    }

    if (sw.done) {
      sw.blinkTick = (sw.blinkTick || 0) + 1;
      sw.rowEl.style.background = (Math.floor(sw.blinkTick / 5) % 2 === 0) ? COLOR_DONE : COLOR_BG;
    }
  }

  function toggleRun(sw) {
    if (sw.running) {
      sw.elapsedMs = getElapsed(sw);
      sw.running = false;
    } else {
      if (sw.done) {
        sw.done = false;
        sw.beeped = false;
        sw.rowEl.style.background = COLOR_BG;
        if (sw.type === 'timer') { sw.elapsedMs = 0; }
      }
      sw.startTs = Date.now();
      sw.running = true;
    }
    redrawRow(sw);
  }

  function resetRow(sw) {
    sw.running = false;
    sw.elapsedMs = 0;
    sw.startTs = Date.now();
    sw.done = false;
    sw.beeped = false;
    sw.blinkTick = 0;
    sw.rowEl.style.background = COLOR_BG;
    redrawRow(sw);
  }

  function removeRow(sw) {
    var idx = -1;
    for (var i = 0; i < stopwatches.length; i++) {
      if (stopwatches[i].id === sw.id) { idx = i; break; }
    }
    if (idx > -1) { stopwatches.splice(idx, 1); }
    swGrid.removeChild(sw.rowEl);
    updateEmptyState();
    reflowGrid();
  }

  function addTile(type, totalMs) {
    var id = nextId++;
    var row = document.createElement('div');
    row.className = (type === 'timer') ? 'swRow swTimer' : 'swRow';

    var label = document.createElement('div');
    label.className = 'swLabel';
    label.innerHTML = (type === 'timer' ? 'TEMPORIZADOR ' : 'CRONOMETRO ') + id;
    row.appendChild(label);

    label.addEventListener('click', function () {
      var name = prompt('Nombre:', '');
      if (name !== null) {
        name = name.replace(/^\s+|\s+$/g, '');
        if (name.length) { label.textContent = name; }
      }
    }, false);

    var timeEl = document.createElement('div');
    timeEl.className = 'swTime';
    timeEl.innerHTML = '00:00.0';
    row.appendChild(timeEl);

    var btns = document.createElement('div');
    btns.className = 'swBtns';

    var startBtn = document.createElement('div');
    startBtn.className = 'swBtn swPause';
    startBtn.innerHTML = 'PAUSAR';
    btns.appendChild(startBtn);

    var resetBtn = document.createElement('div');
    resetBtn.className = 'swBtn swReset';
    resetBtn.innerHTML = 'REINICIAR';
    btns.appendChild(resetBtn);

    var removeBtn = document.createElement('div');
    removeBtn.className = 'swBtn swRemove';
    removeBtn.innerHTML = 'X';
    btns.appendChild(removeBtn);

    row.appendChild(btns);
    swGrid.appendChild(row);

    var sw = {
      id: id,
      type: type,
      totalMs: totalMs || 0,
      elapsedMs: 0,
      running: true,
      done: false,
      beeped: false,
      blinkTick: 0,
      startTs: Date.now(),
      rowEl: row,
      timeEl: timeEl,
      startBtn: startBtn
    };
    stopwatches.push(sw);

    startBtn.addEventListener('click', function () { toggleRun(sw); }, false);
    resetBtn.addEventListener('click', function () { resetRow(sw); }, false);
    removeBtn.addEventListener('click', function () { removeRow(sw); }, false);

    updateEmptyState();
    reflowGrid();
  }

  function addStopwatch() {
    addTile('sw', 0);
  }

  /* ---------- selector de tiempo del temporizador (un toque) ---------- */
  var TIMER_PRESETS = [10, 15, 20, 30, 45, 60, 90, 120, 180, 300];
  var presetOverlay = document.getElementById('presetOverlay');
  var presetGrid = document.getElementById('presetGrid');
  var presetCancelBtn = document.getElementById('presetCancelBtn');

  function fmtPreset(seconds) {
    if (seconds < 60) { return seconds + 'S'; }
    var m = Math.floor(seconds / 60);
    var s = seconds % 60;
    return s ? (m + ':' + (s < 10 ? '0' : '') + s) : (m + 'MIN');
  }

  function crearTemporizador(seconds) {
    addTile('timer', seconds * 1000);
    presetOverlay.style.display = 'none';
  }

  (function buildPresetGrid() {
    var i;
    for (i = 0; i < TIMER_PRESETS.length; i++) {
      (function (seconds) {
        var btn = document.createElement('div');
        btn.className = 'presetBtn';
        btn.appendChild(document.createTextNode(fmtPreset(seconds)));
        btn.addEventListener('click', function () { crearTemporizador(seconds); }, false);
        presetGrid.appendChild(btn);
      })(TIMER_PRESETS[i]);
    }
    var otherBtn = document.createElement('div');
    otherBtn.className = 'presetBtn presetBtnOther';
    otherBtn.appendChild(document.createTextNode('OTRO'));
    otherBtn.addEventListener('click', function () {
      var input = prompt('Duracion en segundos:', '30');
      if (input === null) { return; }
      var seconds = parseInt(input, 10);
      if (isNaN(seconds) || seconds <= 0) { seconds = 30; }
      crearTemporizador(seconds);
    }, false);
    presetGrid.appendChild(otherBtn);
  })();

  presetCancelBtn.addEventListener('click', function () {
    presetOverlay.style.display = 'none';
  }, false);

  function addTimer() {
    presetOverlay.style.display = 'block';
  }

  addSwBtn.addEventListener('click', addStopwatch, false);
  addTimerBtn.addEventListener('click', addTimer, false);

  setInterval(function () {
    for (var i = 0; i < stopwatches.length; i++) {
      if (stopwatches[i].running || stopwatches[i].done) { redrawRow(stopwatches[i]); }
    }
  }, 100);

  updateEmptyState();

  /* ---------- calculadora basica (sumar, restar, multiplicar, dividir) ---------- */
  var calcA = document.getElementById('calcA');
  var calcB = document.getElementById('calcB');
  var calcBasicResult = document.getElementById('calcBasicResult');

  function limpiar(el) {
    while (el.firstChild) { el.removeChild(el.firstChild); }
  }

  function formatearNumero(n) {
    var r = Math.round(n * 100) / 100;
    return String(r);
  }

  function agregarResultado(label, texto) {
    var lbl = document.createElement('div');
    lbl.className = 'calcTotalLabel';
    lbl.appendChild(document.createTextNode(label));
    var val = document.createElement('div');
    val.className = 'calcTotal';
    val.appendChild(document.createTextNode(texto));
    calcBasicResult.appendChild(lbl);
    calcBasicResult.appendChild(val);
  }

  function calcularBasica() {
    limpiar(calcBasicResult);
    var a = parseFloat(calcA.value);
    var b = parseFloat(calcB.value);
    if (isNaN(a) || isNaN(b)) { return; }
    agregarResultado('SUMA', formatearNumero(a + b));
    agregarResultado('RESTA', formatearNumero(a - b));
    agregarResultado('MULTIPLICACION', formatearNumero(a * b));
    agregarResultado('DIVISION', b !== 0 ? formatearNumero(a / b) : 'no se puede dividir por 0');
  }

  calcA.addEventListener('input', calcularBasica, false);
  calcA.addEventListener('keyup', calcularBasica, false);
  calcB.addEventListener('input', calcularBasica, false);
  calcB.addEventListener('keyup', calcularBasica, false);

})();
</script>
</body>
</html>
